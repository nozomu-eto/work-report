services:
  mariadb:
    image: mariadb:12.3
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: work_report
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  mariadb-data:
